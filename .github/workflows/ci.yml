name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build and test
        run: mvn -B clean package -DskipTests=false -DforkCount=0

      - name: Jar smoke test
        run: java -jar target/agentcli-1.0.0.jar --version

      - name: Legacy identifier scan
        run: |
          set -e
          patterns=("com.paicli" "paicli_" "~/.paicli" " paicli ")
          roots=(src README.md pom.xml .env.example)
          hits=0
          for root in "${roots[@]}"; do
            [ -e "$root" ] || continue
            if [ -d "$root" ]; then
              mapfile -t files < <(find "$root" -type f \( -name '*.java' -o -name '*.md' -o -name '*.xml' -o -name '*.yml' -o -name '*.yaml' -o -name '*.properties' \))
            else
              files=("$root")
            fi
            for file in "${files[@]}"; do
              [[ "$file" == *SourceQualityScanTest.java ]] && continue
              content=$(tr '[:upper:]' '[:lower:]' < "$file")
              for p in "${patterns[@]}"; do
                if [[ "$content" == *"$p"* ]]; then
                  echo "$file -> $p"
                  hits=1
                fi
              done
            done
          done
          [ "$hits" -eq 0 ] || { echo "Legacy identifier scan failed"; exit 1; }

      - name: Secret leak scan
        run: |
          if git log -p --all 2>/dev/null | grep -qE 'sk-[a-zA-Z0-9]{20,}|Bearer [a-zA-Z0-9._-]{20,}'; then
            echo "Possible secret in git history"
            exit 1
          fi

      - name: Upload fat-jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentcli-fat-jar
          path: target/agentcli-1.0.0.jar
          retention-days: 30
