name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build and test
        run: mvn -B clean package -DskipTests=false -DforkCount=0

      - name: Jar smoke test
        run: java -jar target/agentcli-1.0.0.jar --version

      - name: Create release with fat-jar
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: target/agentcli-1.0.0.jar
